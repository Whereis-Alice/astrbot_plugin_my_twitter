name: Checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt pytest pytest-asyncio ruff pillow jinja2 playwright
      - run: playwright install --with-deps chromium
      - run: python -m pytest -q
      - run: python -m ruff check main.py twitter_api.py twitter_renderer.py twitter_webui.py services tests
      - run: python -m compileall -q main.py twitter_api.py twitter_renderer.py twitter_webui.py services
      - run: node --test tests/test_webui_batch.mjs
